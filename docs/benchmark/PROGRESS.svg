<text x="104" y="446" font-size="10" fill="#6b7280">Filled point: reasoning conditions recorded. Hollow point: unrecorded, never comparable. Line: only between runs made under the same conditions.</text>
<text x="104" y="498" font-size="15" font-weight="600" fill="#1f2328">2 · Score against model size</text>
<text x="104" y="516" font-size="11" fill="#6b7280">localization@5 against model memory. A competitor enters only if it publishes the same quantity.</text>
<rect x="104" y="532" width="806" height="244" fill="#fafafa" stroke="#e4e7eb" stroke-dasharray="6 4"/>
<text x="507" y="596" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">Missing number: a resolve rate of our own, over as few as 10-20 instances.</text>
<text x="507" y="620" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">We measure localisation today (26/155); competitors publish how many they resolve.</text>
<text x="507" y="644" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">Nobody publishes "localization@5", so there is no honest comparison to draw.</text>
<text x="507" y="668" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">This fills itself in once bench.mjs writes a "resolved" field and rivals.json has rows.</text>
<text x="104" y="952" font-size="15" font-weight="600" fill="#1f2328">3 · Score against step count</text>
<text x="104" y="970" font-size="11" fill="#6b7280">How much a plan improves when the agent tries, reads the failure, and repairs.</text>
<rect x="104" y="986" width="806" height="244" fill="#fafafa" stroke="#e4e7eb" stroke-dasharray="6 4"/>
<text x="507" y="1050" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">Missing loop: every plan is 1 step, across all 1240 rows measured.</text>
<text x="507" y="1074" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">One value on the x axis is not a curve, it is a point.</text>
<text x="507" y="1098" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">It needs edit -&gt; run the tests -&gt; read the error -&gt; repair, measured again at each turn.</text>
<text x="507" y="1122" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">This fills itself in as soon as a run contains plans of more than one step.</text>
</svg>