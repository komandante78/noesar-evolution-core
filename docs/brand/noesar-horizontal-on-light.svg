    </filter>
    <filter id="cast" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="7" dy="13" stdDeviation="9" flood-color="#16264F" flood-opacity="0.30"/>
    </filter>

    <!-- NOESAR as outlines: no font is required to render this file -->
    <mask id="wordmask">
      <rect width="800" height="800" fill="#000"/>
      <g fill="#FFF" fill-rule="evenodd">
        <g transform="translate(175 583) scale(0.62)"><path d="M0 100 V0 H18 L58 68 V0 H76 V100 H58 L18 32 V100 Z"/></g>
        <g transform="translate(497.56 583) scale(0.62)"><path d="M0 100 L30 0 L48 0 L78 100 L57 100 L52 82 L26 82 L21 100 Z M30.5 66 L47.5 66 L39 22 Z"/></g>
      </g>
      <g fill="none" stroke="#FFF" stroke-width="18" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="8">
        <g transform="translate(258.12 583) scale(0.62)"><ellipse cx="40" cy="50" rx="31" ry="41"/></g>
        <g transform="translate(343.72 583) scale(0.62)"><path d="M55 9 L9 9 L9 91 L55 91"/><path d="M9 50 L50 50"/></g>
        <g transform="translate(419.4 583) scale(0.62)"><path d="M59 26 C59 13 47.5 4.5 34 4.5 C20.5 4.5 9 12 9 24 C9 36 19 41 34 45 C49 49 59 55 59 69 C59 83 47.5 95.5 34 95.5 C20.5 95.5 9 87 9 74"/></g>
        <g transform="translate(581.92 583) scale(0.62)"><path d="M9 100 L9 9 L40 9 C52 9 60 17.5 60 28 C60 38.5 52 47 40 47 L9 47"/><path d="M37 47 L61 100"/></g>
      </g>
    </mask>
  </defs>

  <!-- mark -->
  <g transform="translate(-77.6 -42.55) scale(0.55)">
