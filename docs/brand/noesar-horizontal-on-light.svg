    <rect x="232" y="152" width="60" height="396" fill="url(#vshade)"/>
    <rect x="508" y="152" width="60" height="396" fill="url(#vshade)"/>
    <g>
      <rect x="232" y="152" width="2.5" height="396" fill="#6E92DC" opacity="0.85"/>
      <rect x="508" y="152" width="2.5" height="396" fill="#6E92DC" opacity="0.85"/>
      <rect x="289.5" y="152" width="2.5" height="396" fill="#0B1631" opacity="0.55"/>
      <rect x="565.5" y="152" width="2.5" height="396" fill="#0B1631" opacity="0.55"/>
    </g>
    <g clip-path="url(#panels)" filter="url(#contact)" opacity="0.42">
      <path d="M310 548 L504 170" stroke="#050C22" stroke-width="15" stroke-linecap="round" fill="none"/>
      <circle cx="310" cy="548" r="16" fill="#050C22"/>
      <circle cx="504" cy="170" r="16" fill="#050C22"/>
    </g>
    <g filter="url(#bloom)" opacity="0.34">
      <path d="M303 538 L497 160" stroke="url(#diag)" stroke-width="15" stroke-linecap="round" fill="none"/>
    </g>
    <g stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M410 274 L441 303" stroke="#E63A66" stroke-width="5"/>
      <path d="M436 360 L404 378" stroke="#6F4EEC" stroke-width="5"/>
      <path d="M325 450 L357 472" stroke="#12B8E0" stroke-width="5"/>
    </g>
    <circle cx="400" cy="263" r="8" fill="#E63A66"/>
    <circle cx="447" cy="351" r="8" fill="#6F4EEC"/>
    <circle cx="315" cy="440" r="8" fill="#12B8E0"/>
    <path d="M303 538 L497 160" stroke="url(#diag)" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M303 538 L497 160" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <circle cx="303" cy="538" r="19" fill="none" stroke="url(#nodeA)" stroke-width="8"/>
    <path d="M284.3 534.7 A19 19 0 0 1 312.5 521.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="303" cy="538" r="7.5" fill="#FFFFFF"/>
    <circle cx="497" cy="160" r="19" fill="none" stroke="url(#nodeB)" stroke-width="8"/>
    <path d="M478.3 156.7 A19 19 0 0 1 506.5 143.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="497" cy="160" r="7.5" fill="#FFFFFF"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(125 -486)">
    <rect x="170" y="576" width="460" height="76" fill="url(#word)" mask="url(#wordmask)"/>
  </g>

  <!-- tagline -->
  <text x="525" y="201" text-anchor="middle" fill="#1CA0CE"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"
        font-size="24" font-weight="500" letter-spacing="11">AI SELF HOSTED</text>
</svg>
