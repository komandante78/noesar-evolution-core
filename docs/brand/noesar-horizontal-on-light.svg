<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="NOESAR — AI self hosted">
  <title>NOESAR — AI self hosted</title>
  <defs>
    <linearGradient id="faceL" x1="232" y1="0" x2="292" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A5DB0"/>
      <stop offset="0.18" stop-color="#2F4E9A"/>
      <stop offset="0.62" stop-color="#26407F"/>
      <stop offset="1" stop-color="#16264F"/>
    </linearGradient>
    <linearGradient id="faceR" x1="508" y1="0" x2="568" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A5DB0"/>
      <stop offset="0.18" stop-color="#2F4E9A"/>
      <stop offset="0.62" stop-color="#26407F"/>
      <stop offset="1" stop-color="#16264F"/>
    </linearGradient>
    <linearGradient id="vshade" x1="0" y1="152" x2="0" y2="548" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#050C22" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="diag" x1="303" y1="538" x2="497" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12C0E4"/>
      <stop offset="0.34" stop-color="#4A72EC"/>
      <stop offset="0.68" stop-color="#8642E6"/>
      <stop offset="1" stop-color="#EE2A88"/>
    </linearGradient>
    <linearGradient id="nodeA" x1="286" y1="554" x2="320" y2="522" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12C0E4"/>
      <stop offset="1" stop-color="#6152EA"/>
    </linearGradient>
    <linearGradient id="nodeB" x1="480" y1="176" x2="514" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8642E6"/>
      <stop offset="1" stop-color="#EE2A88"/>
    </linearGradient>
    <linearGradient id="word" x1="175" y1="0" x2="625" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D50A8"/>
      <stop offset="0.30" stop-color="#18263F"/>
      <stop offset="0.55" stop-color="#16213E"/>
      <stop offset="1" stop-color="#7856C8"/>
