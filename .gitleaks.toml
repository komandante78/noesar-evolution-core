# NOESAR EVOLUTION — secret scanning configuration
#
# B-002 recorded that neither gitleaks nor trufflehog was available and that a heuristic
# pattern scan stood in for one. A real scan was run on 2026-07-27 over all 118 commits
# (~77.9 MB): 29 findings, every one of them inside `rust/vendor/`, and none in first-party
# code.
#
# The vendored findings are upstream Win32 binding constants -- `pub const
# XCN_NCRYPT_UI_PROTECT_KEY_FLAG: u32 = 1i32;` and its siblings -- whose high-entropy
# identifiers trip `generic-api-key`. They are not secrets and they are not ours.
#
# The allowlist is scoped to `rust/vendor/` and nothing else. Suppressing by rule instead
# of by path would have silenced `generic-api-key` across the whole tree, which is how a
# scanner becomes a check people learn to skip.

[extend]
useDefault = true

[[allowlists]]
description = "Vendored upstream crates: third-party source, reviewed as noise on 2026-07-27"
paths = ['''^rust/vendor/''']

# D-0198/D-0199: services/reference-control-plane/test/tls.test.mjs, commit f721d625,
# briefly contained a placeholder shaped like a PEM private key block
# (`-----BEGIN PRIVATE KEY-----\nMIIE\n-----END PRIVATE KEY-----\n`) to exercise
# resolveTls()'s "does this look like PEM" check. It never held real key material -- four
# bytes of literal text, not a base64-encoded key of any length -- but it matched the
# generic `private-key` rule's structural pattern regardless of content. The commit is
# already pushed to origin (D-0199), so it is not rewritten (CLAUDE10 rule 14); the test
# fixture itself was changed in the next commit to stop reproducing the pattern at all.
# Scoped to that one historical commit, not to the file or the rule generally -- a real
# key landing in this same file later must still be caught.
[[allowlists]]
description = "Self-inflicted false positive: test fixture shaped like a PEM key, not a real one — commit f721d625, fixed forward same phase"
commits = ["f721d6253c4bbfe47060fbef7dcdfcb3790c40f5"]

# ---------------------------------------------------------------------------------------
# 2026-09-20. The scan had been FAILING on eight findings, and nothing in the repository ran
# it, so nobody knew. All eight were investigated one by one and none is a secret. They are
# recorded here by cause, not swept under one rule, because every one of them is a shape this
# repository will keep producing.
#
# A method note worth more than the entries: the first pass at this was read off a report
# produced with `--redact`, which prints every secret as the word REDACTED. That made all
# eight look like the literal string REDACTED. The findings below are from an UNREDACTED
# report, classified by shape on the machine that holds it.
#
# Nothing here is scoped to a rule or to a whole file: a real key landing in any of these
# same files, on any later commit, is still caught.

# Four findings, in EVIDENCE/live_config_*.json: the value the capture WROTE INSTEAD of the
# secret. Anchored at the start, so a value that merely contains the word is still a finding.
[[allowlists]]
description = "A captured value that begins with the redaction marker is what redaction produced, not a secret"
regexes = ['''^REDACTED''']

# Two findings, in websocket-framing.test.mjs and coden-bridge.test.mjs: the value of the
# Sec-WebSocket-Key header. RFC 6455 makes that a 24-character base64 nonce the CLIENT invents
# for every handshake -- it authenticates nothing, it is not a credential, and a websocket test
# cannot be written without one.
[[allowlists]]
description = "Sec-WebSocket-Key: an RFC 6455 handshake nonce, invented per connection, authenticating nothing"
regexTarget = "line"
regexes = ['''(?i)sec-websocket-key''']

# One finding, api-target-registry.test.mjs at commit 67366603: a fixture written in the shape
# of an OpenAI key. It is 24 characters where a real one is 51, and it never left the test.
# Scoped to that commit: the fixture is also being changed so the shape stops being produced,
# but a commit already pushed is not rewritten (CLAUDE10 rule 14), so the history needs this.
[[allowlists]]
description = "Test fixture shaped like an API key, commit 67366603 -- fixed forward, history cannot be"
commits = ["673666035b130b752d48b06b142fd4aca24e78da"]

# One finding, tls.test.mjs at commit 3f75279a: the SAME four-byte PEM placeholder
# (`-----BEGIN PRIVATE KEY-----\nMIIE\n-----END PRIVATE KEY-----`) that the entry above
# already excuses at commit f721d625. Verified 2026-09-20: OpenSSL refuses to decode it
# ("DECODER routines::unsupported"), and `git log --diff-filter=A` over all of history shows
# the only .pem ever added to this repository is a PUBLIC key. The lesson is in the miss: an
# allowlist scoped to one commit does not cover the sibling commit that carries the same blob.
[[allowlists]]
description = "The same four-byte PEM placeholder as f721d625, on its sibling commit 3f75279a"
commits = ["3f75279ab134239dc30816e41ef0cdb1e67eecde"]
