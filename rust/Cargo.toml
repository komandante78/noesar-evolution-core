[workspace]
resolver = "2"
members = [
  "crates/noesar-contracts",
  "crates/noesar-auth",
  "crates/noesar-security-kernel",
  "crates/noesar-hardware-orchestrator",
  "crates/noesar-audit-ledger",
  "crates/noesar-control-plane",
  "crates/noesar-authority-api",
  "crates/noesar-data-plane",
  "crates/noesar-authority-protocol",
  "crates/noesar-canonical-json",
  "crates/noesar-authority-transport",
  "crates/noesar-authority-daemon",
  "crates/noesar-reasoning",
  "crates/noesar-reasoning-reference",
  "crates/noesar-capability",
  "crates/noesar-shadow",
  "crates/noesar-executor"
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "AGPL-3.0-or-later OR LicenseRef-NOESAR-Commercial"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
rand = "0.9"
sha1 = "0.10"
subtle = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }

libc = "0.2"
